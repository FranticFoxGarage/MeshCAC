# MeshCAC Configuration
# Location: /etc/meshcac/meshcac.conf

# ---- REQUIRED ----

# Your Linux username (run 'whoami' to check)
USERNAME=""

# Idle lock delay in seconds when device is NOT connected (900 = 15 min)
IDLE_LOCK_DELAY=900

# Your desktop environment: cinnamon, gnome, kde, xfce
DESKTOP_ENV="cinnamon"


# ---- USB DEVICE ----

# Your device's vendor and product ID (run 'lsusb' to find them, format: xxxx)
USB_VENDOR=""
USB_PRODUCT=""

# Your device's serial number - locks to ONE specific device
# Run: udevadm info -a -n /dev/ttyUSB0 | grep serial
# Leave blank to match ANY device with the above vendor/product (not recommended)
USB_SERIAL=""


# ---- HOME ASSISTANT (optional) ----
# Leave HA_TOKEN blank to disable HA integration entirely

HA_TOKEN=""
HA_HOST=""
HA_IP=""
HA_ENTITY=""
HA_FRIENDLY=""
